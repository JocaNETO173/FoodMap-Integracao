<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodMap - Cadastrar Restaurante</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo-container logo-reload">
            <div class="logo-brand font-decorative">
                Fo<a href="/" class="pin-icon"></a>dMap
            </div>
        </div>

        <span class="gear-btn" id="gearBtn" role="button" aria-label="Opções do usuário" tabindex="0">
            <img src="/static/gear.png" alt="">
        </span>

        <div class="user-dropdown" id="userDropdown">
            <div class="user-info-name">{{ nome }}.admin</div>
            <div class="user-info-email">{{ email }}</div>
            <div class="dropdown-divider"></div>
            <a href="/login" class="logout-btn">Sair da conta</a>
        </div>
    </header>

    <main class="content-container">
        <div class="auth-wrapper" style="min-height: auto; padding: 20px 0;">
            <div class="auth-card" style="max-width: 500px;">
                <h2 style="text-align: center; font-size: 1.4rem; font-weight: 600; margin-bottom: 10px; color: var(--primary-red);">
                    Cadastrar Restaurante
                </h2>

                <form action="/cadastro-restaurantes" method="POST">
                    <div class="form-group" style="margin-bottom: 14px;">
                        <label for="nome-restaurante">Nome do Restaurante:</label>
                        <input type="text" name="nome-restaurante" class="form-input" placeholder="Ex: Pizzaria Londrina" required>
                    </div>

                    <div class="form-group" style="margin-bottom: 14px;">
                        <label for="categoria">Categoria:</label>
                        <input type="text" name="categoria" class="form-input" placeholder="Ex: Lanchonete" required>
                    </div>

                    <div class="form-group" style="margin-bottom: 14px;">
                        <label for="descricao">Descrição:</label>
                        <textarea name="descricao" class="form-input" style="border-radius: 15px; resize: vertical; min-height: 90px;" placeholder="Digite uma breve descrição..." required></textarea>
                    </div>

                    <div class="form-group" style="margin-bottom: 14px;">
                        <label for="endereco">Endereço:</label>
                        <input type="text" name="endereco" class="form-input" placeholder="Rua, Número, Bairro - Londrina" required>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="imagem">URL da Imagem / Foto:</label>
                        <input type="text" name="imagem" class="form-input" placeholder="https://exemplo.com/imagem.jpg">
                    </div>

                    <button type="submit" class="btn-primary-red">Salvar Restaurante</button>
                    <a href="/restaurantes_admin" style="display: block; text-align: center; margin-top: 12px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Cancelar</a>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
