<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodMap - Cadastrar Restaurante</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo-container logo-reload">
            <div class="logo-brand font-decorative">
                Fo<span class="pin-icon"></span>dMap
            </div>
        </div>

        <button class="gear-btn" id="gearBtn" aria-label="Opções do usuário">
            <svg viewBox="0 0 24 24">
                <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81C14.36,2.58,14.16,2.4,13.92,2.4 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
            </svg>
        </button>

        <div class="user-dropdown" id="userDropdown">
            <div class="user-info-name">Administrador</div>
            <div class="user-info-email">admin@foodmap.com</div>
            <div class="dropdown-divider"></div>
            <a href="/login" class="logout-btn">Sair da conta</a>
        </div>
    </header>

    <main class="content-container">
        <div class="auth-wrapper" style="min-height: auto; padding: 20px 0;">
            <div class="auth-card" style="max-width: 500px;">
                <h2 style="text-align: center; font-size: 1.4rem; font-weight: 600; margin-bottom: 10px; color: var(--primary-red);">
                    Cadastrar Restaurante
                </h2>

                <form action="/restaurantes-admin" method="GET">
                    <div class="form-group" style="margin-bottom: 14px;">
                        <label for="nome-restaurante">Nome do Restaurante:</label>
                        <input type="text" id="nome-restaurante" class="form-input" placeholder="Ex: Pizzaria Londrina" required>
                    </div>

                    <div class="form-group" style="margin-bottom: 14px;">
                        <label for="descricao">Descrição:</label>
                        <textarea id="descricao" class="form-input" style="border-radius: 15px; resize: vertical; min-height: 90px;" placeholder="Digite uma breve descrição..." required></textarea>
                    </div>

                    <div class="form-group" style="margin-bottom: 14px;">
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" class="form-input" placeholder="Rua, Número, Bairro - Londrina" required>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="imagem">URL da Imagem / Foto:</label>
                        <input type="url" id="imagem" class="form-input" placeholder="https://exemplo.com/imagem.jpg">
                    </div>

                    <button type="submit" class="btn-primary-red">Salvar Restaurante</button>
                    <a href="/restaurantes-admin" style="display: block; text-align: center; margin-top: 12px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Cancelar</a>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
