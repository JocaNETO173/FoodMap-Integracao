<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodMap - Restaurantes (Admin)</title>

        <div class="user-dropdown" id="userDropdown">
            <div class="user-info-name">Administrador</div>
            <div class="user-info-email">admin@foodmap.com</div>
            <div class="dropdown-divider"></div>
            <a href="/login" class="logout-btn">Sair da conta</a>
        </div>
    </header>

    <main class="content-container">
        <div class="search-bar-container">
            <svg class="search-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" placeholder="Pesquise aqui">
        </div>

        <!-- ESPAÇO RESERVADO PARA OS RESTAURANTES DO BANCO DE DADOS -->
        <div id="restaurants-list-container">
            <!-- 
                ESPAÇO DO BANCO DE DADOS:
                Insera dinamicamente os cards de restaurante aqui.
            -->
        </div>

        <div class="admin-action-container">
            <a href="/cadastro-restaurantes" class="btn-admin-add">Cadastrar um Novo Restaurante</a>
        </div>
    </main>

</html>
